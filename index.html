<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lentigob</title>
  <meta name="description" content="Sitio web de Lentigob en GitHub Pages" />

  <!-- Favicons / iconos para pestaña, escritorio y pantalla de inicio móvil -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#3c5aa6" />

  <style>
    /* Variables críticas en primer paint (antes de cargar variables.css) */
    /* Nota: variables.css hereda estas claves para mantener una sola fuente de verdad. */
    :root {
      /* Tipografía base compartida por loader y estilos globales */
      --app-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;

      /* Colores de tema base (azules) usados por el loader y por variables.css */
      --app-theme-color: #3c5aa6;
      --app-theme-color-dark: #253c73;
      --app-theme-color-rgb: 60, 90, 166;
      --app-theme-color-dark-rgb: 37, 60, 115;
    }
  </style>

  <!-- Tema de Docsify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />

  <!-- Detecta entorno local vs producción (sin build step, ver js/env.js) -->
  <script src="js/env.js"></script>
  <script>
    // Estilos propios: en desarrollo se agrega un query param que cambia en
    // cada carga para forzar al navegador a no usar la versión cacheada; en
    // producción (GitHub Pages) se sirven sin query param y el cache normal
    // del navegador/CDN aplica.
    var __cacheBust = window.__DEV__ ? '?v=' + Date.now() : '';
    ['variables', 'custom', 'sidebar', 'input-controls', 'components'].forEach(function (name) {
      document.write('<link rel="stylesheet" href="css/' + name + '.css' + __cacheBust + '">');
    });
  </script>

  <style>
    body.is-booting {
      margin: 0;
      overflow: hidden;
      font-family: var(--app-font-family);
    }

    .boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      background:
        radial-gradient(circle at 15% 15%, rgba(var(--app-theme-color-rgb), 0.16), transparent 38%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.06), transparent 35%),
        linear-gradient(140deg, #141829 0%, var(--app-theme-color-dark) 58%, var(--app-theme-color) 100%);
      color: #ffffff;
      font-family: var(--app-font-family);
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }

    .boot-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-splash__title {
      margin: 0;
      font-size: clamp(1.35rem, 1.4vw + 0.95rem, 2rem);
      letter-spacing: 0.04em;
      font-weight: 700;
      font-family: inherit;
    }

    .boot-splash__spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      animation: boot-spin 0.9s linear infinite;
    }

    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="is-booting">

  <div id="boot-splash" class="boot-splash" aria-hidden="true">
    <div class="boot-splash__spinner"></div>
    <h1 class="boot-splash__title">LENTI</h1>
  </div>

  <div id="app"></div>

  <!-- Vue (global build, incluye el compilador de plantillas en tiempo de ejecución) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Markdown Parser (Marked) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Núcleo de Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins de Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <!-- PapaParse para lectura de archivos CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>

  <!-- Web Components basados en Vue -->
  <script>
    ['md-content', 'icon-svg', 'app-components', 'vue-mount', 'csv-loader'].forEach(function (name) {
      document.write('<script src="js/components/' + name + '.js' + __cacheBust + '"><' + '/script>');
    });
  </script>

  <script>
    window.$docsify = {
      name: 'Lentigob',
      logo: 'assets/logo-mark.svg',
      executeScript: true,
      loadSidebar: true,
      loadNavbar: true,
      mergeNavbar: false,
      subMaxLevel: 0,
      auto2top: true,
      notFoundPage: '/docs/404.md',

      // En desarrollo, evita que el navegador cachee el Markdown mientras se
      // edita (docsify lo carga vía fetch/AJAX). En producción no se manda
      // este header y el cache normal del navegador/CDN aplica.
      requestHeaders: window.__DEV__
        ? { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
        : {},
      plugins: [
        function (hook, vm) {
          hook.mounted(function () {

            // Cerrando la sidebar automáticamente en pantallas pequeñas al cargar la página
            if (window.innerWidth < 820 && document.body.classList.contains('close')) {
              document.body.classList.remove('close');
            }

            const splash = document.getElementById('boot-splash');
            document.body.classList.remove('is-booting');

            if (splash) {
              splash.classList.add('is-hidden');
              setTimeout(() => splash.remove(), 320);
            }
          });

          // Docsify cambia document.title al primer encabezado de cada página;
          // doneEach corre después de eso en cada navegación, así que lo
          // pisamos para que la pestaña siempre diga el nombre del sitio
          // (vm.config.name, la misma config de arriba, sin repetir el string).
          hook.doneEach(function () {
            document.title = vm.config.name;
          });

          // Agrega automáticamente un enlace "Volver" en cualquier página que
          // viva en una subcarpeta de docs/ (p.ej. docs/proyectos/P-004.md),
          // apuntando a su sección padre (docs/proyectos). Así el cliente no
          // tiene que escribir ese enlace a mano en cada página de detalle
          // que cree - y evita el problema de los links en Markdown ([texto](#/ruta))
          // que Docsify interpreta como anclas de la misma página en vez de
          // navegación real; por eso aquí se inyecta HTML crudo (<a href="#...">),
          // igual que en el resto del sitio.
          hook.afterEach(function (html, next) {
            var parts = vm.route.path.split('/').filter(Boolean);
            if (parts.length >= 3 && parts[0] === 'docs') {
              var parentPath = '/' + parts.slice(0, 2).join('/');
              html =
                '<p><a href="#' +
                parentPath +
                '" class="hero-btn btn-secondary">← Volver</a></p>' +
                html;
            }
            next(html);
          });
        }
      ],

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      }
    };
  </script>

</body>
</html>
